<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 스터디룸 스프린트 실습 가이드 (웹 가이드와 같은 내용의 저장소 사본). 더블클릭해서 브라우저로 엽니다. -->
</head><body style="margin:0">
<title>스터디룸 스프린트 실습 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Nanum+Pen+Script&display=swap">
<style>
/* 배치: 위 고정 막대 + 왼쪽 목차(실습 순서) + 가운데 본문 한 줄 폭. 단계 하나가 한 화면. 강의 덱과 같은 주황 계열 */
:root{
  --bg:#FCFBF9; --panel:#F3F0EC; --line:#E2DCD4; --ink:#1E1B18; --muted:#6A625A;
  --accent:#B4471B; --accent-soft:#F8E9E1; --on-accent:#FFFFFF;
  --ok:#1E7A45; --ok-soft:#E5F4EA; --warn:#A96400; --warn-soft:#FBF0DD; --bad:#BC3A2C; --bad-soft:#FBE9E6;
  --info:#2F5E8A; --info-soft:#E7EFF7;
  --code-bg:#14181D; --code-ink:#E2E6EA; --code-dim:#8A949E;
  --d-edge:#9A8F84; --d-tint:#F5F1EC;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15120F; --panel:#1F1B17; --line:#342D27; --ink:#EDE7E0; --muted:#A89E94;
  --accent:#F08A5D; --accent-soft:#3A2116; --on-accent:#2A1208;
  --ok:#5FC68D; --ok-soft:#13291D; --warn:#E3A645; --warn-soft:#2E2312; --bad:#F06C5E; --bad-soft:#331815;
  --info:#7FB0DD; --info-soft:#152535;
  --code-bg:#0C0F12; --code-ink:#DCE2E7; --code-dim:#76818B;
  --d-edge:#857A70; --d-tint:#1C1814; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15120F; --panel:#1F1B17; --line:#342D27; --ink:#EDE7E0; --muted:#A89E94;
  --accent:#F08A5D; --accent-soft:#3A2116; --on-accent:#2A1208;
  --ok:#5FC68D; --ok-soft:#13291D; --warn:#E3A645; --warn-soft:#2E2312; --bad:#F06C5E; --bad-soft:#331815;
  --info:#7FB0DD; --info-soft:#152535;
  --code-bg:#0C0F12; --code-ink:#DCE2E7; --code-dim:#76818B;
  --d-edge:#857A70; --d-tint:#1C1814; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:72px}
body{background:var(--bg);color:var(--ink);font:16px/1.75 var(--f-body);margin:0;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.86em;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:.05em .35em;overflow-wrap:anywhere}
kbd{font-family:var(--f-mono);font-size:.82em;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:.05em .4em;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px}
.topbar .brand{font-weight:700;font-size:15px;letter-spacing:-.01em;text-decoration:none;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.topbar .brand small{font-weight:500;color:var(--muted);margin-left:8px}
.topbar .spacer{flex:1}
.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.progress .bar{width:120px;height:6px;border-radius:3px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);width:0}
.navtoggle{display:none;white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 10px;font:inherit;font-size:14px;cursor:pointer}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:40px;max-width:1180px;margin:0 auto;
  padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.toc{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;font-size:14px;padding-right:6px}
.toc .home{display:block;font-weight:600;text-decoration:none;color:var(--ink);padding:6px 10px;border-radius:6px;margin-bottom:6px}
.toc .sec{margin:14px 0 4px;padding:0 10px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.toc .sec span{color:var(--accent);margin-right:6px}
.toc a.lec{display:grid;grid-template-columns:2.6em 1fr auto;gap:4px;align-items:baseline;text-decoration:none;color:var(--ink);padding:5px 10px;border-radius:6px;line-height:1.45}
.toc a.lec .no{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.toc a.lec .st{font-size:11px;color:var(--muted)}
.toc a.lec.done .st{color:var(--ok)}
.toc a:hover{background:var(--panel)}
.toc a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.toc a:focus-visible,.btn:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{min-width:0;max-width:760px}
.crumb{font-size:13px;color:var(--muted);margin:0 0 6px}
h1{font-size:30px;line-height:1.3;letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
h2{font-size:21px;line-height:1.4;margin:40px 0 12px;text-wrap:balance}
h3{font-size:17px;margin:28px 0 8px}
p,ul,ol{margin:0 0 14px}
li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{font-size:12.5px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.chip.kind{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.clock{font-variant-numeric:tabular-nums}
.lead{font-size:17.5px;color:var(--ink);line-height:1.7;margin-bottom:22px}
.tbl{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px}
td code,th code{overflow-wrap:normal;white-space:nowrap}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel);font-weight:600;font-size:13.5px}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
ol.steps{padding-left:1.4em}
ol.steps li::marker{font-weight:700;color:var(--accent)}
.codeblock{margin:0 0 18px;border-radius:8px;overflow:hidden;background:var(--code-bg);border:1px solid var(--line)}
.codehead{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;font-size:12.5px;color:var(--code-dim);border-bottom:1px solid rgba(255,255,255,.08);min-height:36px}
.codehead .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.codeblock pre{margin:0;padding:12px 14px;overflow-x:auto;color:var(--code-ink);font:13.5px/1.6 var(--f-mono)}
.codeblock pre code{background:none;border:0;padding:0;font-size:inherit;color:inherit;overflow-wrap:normal}
.codeblock.out{background:var(--panel)}
.codeblock.out .codehead{color:var(--muted);border-bottom:1px solid var(--line)}
.codeblock.out pre{color:var(--ink)}
.copy{font:600 12px var(--f-body);color:var(--code-ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:5px;padding:3px 10px;cursor:pointer}
.copy:hover{background:rgba(255,255,255,.16)}
.copy.done{color:#7FE0A9;border-color:#3E8E62}
.where{display:inline-block;font:600 11.5px var(--f-body);padding:1px 8px;border-radius:4px;background:#24404A;color:#BFE6E2;white-space:nowrap}
.where-ai{background:#3B2F55;color:#DCCFF5}
.where-board{background:#4A3A1E;color:#F2D9A6}
.where-gh{background:#2B3340;color:#C9D6EA}
.where-out{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 18px}
.legend div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.legend p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.note{border-radius:8px;padding:12px 16px;margin:0 0 18px;border:1px solid;font-size:15px}
.note>b{display:block;margin-bottom:4px}
.note p:last-child,.note ul:last-child{margin-bottom:0}
.note ul{padding-left:1.2em}
.note.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.note.info>b{color:var(--info)}
.note.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.note.ok>b{color:var(--ok)}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.note.warn>b{color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.note.bad>b{color:var(--bad)}
ol.look{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:8px}
ol.look li{position:relative;padding-left:36px;margin:0}
ol.look li::before{counter-increment:look;content:counter(look);position:absolute;left:0;top:3px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 13px var(--f-body)}
ol.look{counter-reset:look}
.looklabel{font-weight:600;font-size:14px;color:var(--accent);margin:-6px 0 8px}
details.deep{border:1px solid var(--line);border-radius:8px;padding:10px 16px;margin:0 0 18px;background:var(--bg)}
details.deep summary{cursor:pointer;font-weight:600}
details.deep[open] summary{margin-bottom:8px}
.figure{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
svg.dia{display:block;width:100%;min-width:620px;height:auto;font-family:var(--f-body)}
.board{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:8px;min-width:600px}
.board div{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px;font-size:13.5px;min-height:92px}
.board b{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.board span{display:block;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:4px;padding:4px 6px;font-size:12.5px}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:44px;padding-top:20px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--f-body);text-decoration:none;border-radius:7px;padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.donebtn[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.navpair{display:flex;gap:10px;flex-wrap:wrap}
.secgrid{display:grid;gap:10px;margin:0 0 24px}
.seccard{display:grid;grid-template-columns:3.2em 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.seccard:hover{background:var(--panel)}
.seccard .n{font:700 22px var(--f-mono);color:var(--accent)}
.seccard .t{font-weight:600}
.seccard .m{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.seccard small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.versions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;gap:0}
  .navtoggle{display:inline-block}
  nav.toc{position:static;max-height:none;display:none;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:20px}
  nav.toc.open{display:block}
  .progress .bar{width:64px}
  #ptext{display:none}
  h1{font-size:25px}
  .seccard{grid-template-columns:2.4em 1fr}
  .seccard .m{grid-column:2}
}
@media (prefers-reduced-motion:no-preference){.progress .bar i{transition:width .3s}}
/* 목차: 섹션마다 색 띠 + 번호 배지 */
.toc .home{background:var(--panel);border:1px solid var(--line);margin-bottom:14px}
.toc .grp{--g-soft:color-mix(in srgb,var(--g) 13%,var(--bg));margin:0 0 12px;border:1px solid var(--line);border-left:4px solid var(--g);border-radius:10px;background:var(--bg);overflow:hidden}
.toc .grp .sec{display:flex;align-items:center;gap:10px;margin:0;padding:9px 12px;background:var(--g-soft);color:var(--ink);font-size:15px;font-weight:800;letter-spacing:0}
.toc .grp .sec span.gn{flex:none;width:26px;height:26px;margin:0;border-radius:7px;background:var(--g);color:#fff;font:800 14px var(--f-mono);display:inline-flex;align-items:center;justify-content:center}
.toc .grp .sec span.gt{color:var(--ink);margin:0}
.toc .gt small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);line-height:1.3}
.toc .grp a.lec{grid-template-columns:auto 1fr auto;column-gap:10px;align-items:center;padding:7px 12px;border-radius:0;border-top:1px solid var(--line)}
.toc .grp a.lec .no{min-width:34px;padding:2px 0;border-radius:6px;border:1.5px solid var(--g);color:var(--g);font:700 12.5px var(--f-mono);text-align:center}
.toc .grp a.lec .tt{line-height:1.4;font-weight:600}
.toc .grp a.lec .tt small{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.toc .grp a.lec .st{font-size:14px;font-weight:800;color:var(--ok)}
.toc .grp a.lec.done .no{background:var(--ok);border-color:var(--ok);color:#fff}
.toc .grp a.lec[aria-current="page"]{background:var(--g-soft);box-shadow:inset 4px 0 0 var(--g)}
.toc .grp a.lec[aria-current="page"] .no{background:var(--g);color:#fff}
/* 기록 칸: 흐린 글씨는 예시 */
input.cell{width:100%;min-width:90px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px dashed var(--line);border-radius:4px;padding:4px 7px}
input.cell::placeholder{color:var(--muted);opacity:.75;font-style:italic}
input.cell:not(:placeholder-shown){border-style:solid;background:var(--panel)}
input.cell:focus{outline:2px solid var(--accent);border-style:solid}

/* 1-3 역할 포스트잇 · 화이트보드 */
:root{--wb-bg:#FFFFFF;--wb-frame:#B9B2A9;--wb-line:#3B3F46;--wb-ink:#1F4F9A;--wb-red:#C0392B;--wb-tray:#8F877E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--wb-bg:#ECE9E4;--wb-frame:#5B534B;--wb-tray:#4A433C}}
:root[data-theme="dark"]{--wb-bg:#ECE9E4;--wb-frame:#5B534B;--wb-tray:#4A433C}
.hand{font-family:"Nanum Pen Script","Apple SD Gothic Neo",cursive}
.stickies{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:14px 8px 18px}
.sticky{position:relative;min-height:128px;padding:20px 12px 12px;color:#2A241C;box-shadow:0 6px 10px -4px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.12);border-radius:2px 2px 10px 2px}
.sticky::before{content:"";position:absolute;top:-7px;left:50%;width:46px;height:16px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06)}
.sticky .role{font-size:12px;font-weight:700;letter-spacing:.02em;opacity:.75}
.sticky .who{font-family:"Nanum Pen Script",cursive;font-size:34px;line-height:1.05;margin:2px 0 6px}
.sticky .does{font-family:"Nanum Pen Script",cursive;font-size:19px;line-height:1.2}
.s-y{background:#FFE58A;transform:rotate(-2deg)} .s-p{background:#FFC6D3;transform:rotate(1.5deg)}
.s-g{background:#BFEBC9;transform:rotate(-1deg)} .s-b{background:#BFE0F7;transform:rotate(2deg)}
.wb-wrap{overflow-x:auto;margin:0 0 18px}
.wb{min-width:640px;background:var(--wb-bg);border:10px solid var(--wb-frame);border-radius:6px;padding:14px 16px 18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);color:var(--wb-line);position:relative}
.wb-goal{font-family:"Nanum Pen Script",cursive;font-size:30px;line-height:1.1;color:var(--wb-ink);padding:2px 4px 8px;border-bottom:2.5px solid var(--wb-line);border-radius:0 0 40% 60%/0 0 6px 4px}
.wb-goal b{color:var(--wb-red);font-weight:400}
.wb-cols{display:grid;grid-template-columns:repeat(5,1fr);min-height:210px}
.wb-col{border-right:2.5px solid var(--wb-line);padding:6px 8px;position:relative}
.wb-col:last-child{border-right:0}
.wb-col h4{margin:0 0 10px;font-family:"Nanum Pen Script",cursive;font-weight:400;font-size:27px;color:var(--wb-line);text-align:center}
.wb-col h4 small{display:block;font-size:19px;color:var(--wb-red);margin-top:-4px}
.card{background:#FFE58A;color:#2A241C;padding:8px 8px 6px;box-shadow:0 4px 7px -3px rgba(0,0,0,.3);transform:rotate(-1.5deg);border-radius:1px 1px 6px 1px}
.card .t{font-family:"Nanum Pen Script",cursive;font-size:23px;line-height:1.05}
.card .n{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:700;background:#FFFFFFAA;border-radius:9px;padding:1px 7px}
.wb-cap{font-size:13px;color:var(--muted);margin:-8px 0 18px}
@media (max-width:640px){.stickies{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 보드 이동 · KPT 보드 */
.wb.compact .wb-cols{min-height:150px}
.wb.compact .wb-goal{font-size:24px;padding-bottom:6px}
.wb.compact .wb-col h4{font-size:23px;margin-bottom:8px}
.card .who{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.card .who span{font-size:11px;font-weight:700;background:#FFFFFFB3;border-radius:9px;padding:1px 7px}
.card.now{outline:3px solid var(--wb-red);outline-offset:4px;border-radius:2px 2px 8px 2px}
.card.done{background:#BFEBC9}
.card.ghost{background:transparent;border:2px dashed #A9A39B;box-shadow:none;transform:none;color:#8C857D}
.card.ghost .t{font-size:19px}
.mv{font-family:"Nanum Pen Script",cursive;color:var(--wb-red);font-size:21px;text-align:center;margin-top:8px}
.kpt-cols{display:grid;grid-template-columns:repeat(3,1fr);min-height:230px}
.kpt-cols .wb-col{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.kpt-cols .wb-col h4 small{color:var(--wb-line);opacity:.7}
.note-k,.note-p,.note-t{padding:9px 10px;color:#2A241C;font-family:"Nanum Pen Script",cursive;font-size:20px;line-height:1.15;box-shadow:0 4px 7px -3px rgba(0,0,0,.3);border-radius:1px 1px 7px 1px}
.note-k{background:#BFEBC9}.note-p{background:#FFC6D3}.note-t{background:#FFE58A}
.wb-col>div:nth-of-type(odd){transform:rotate(-1.2deg)}.wb-col>div:nth-of-type(even){transform:rotate(1deg)}
.note-t b{font-family:var(--f-body);font-size:11px;font-weight:700;display:inline-block;background:#FFFFFFB3;border-radius:9px;padding:0 6px;margin-right:4px;vertical-align:2px}
.arrow-down{font-family:"Nanum Pen Script",cursive;color:var(--wb-red);font-size:20px;text-align:center;margin-top:auto}
</style>

<template data-id="0-1">
<p class="lead">오늘 실습에서 무엇을 만들고, 이 가이드를 어떻게 읽으면 되는지 정리합니다. 오전 강의에서 본 "질문 먼저 → 스펙 → 테스트 먼저 → 리뷰 → 회고를 파일로"를 팀이 직접 한 바퀴 돌려 보는 것이 목표입니다.</p>

<h2>무엇을 만드나</h2>
<p>스터디룸 예약 서비스의 첫 스토리 하나입니다.</p>
<div class="note info"><b>S1 · 스터디룸 예약</b><p>회원으로서 날짜·시간을 골라 스터디룸을 예약하고 싶다. 같은 룸·같은 시간에는 중복 예약이 안 된다.</p></div>
<p>코드 양보다 <strong>완료의 정의(DoD, Definition of Done)</strong>를 지키는 것이 목표입니다. 끝났을 때 다음 네 가지가 모두 참이어야 S1이 "완료됨"입니다.</p>
<ol>
<li>인수조건의 모든 시나리오가 자동 테스트로 통과한다</li>
<li>코드를 만든 사람이 그 코드를 설명할 수 있다</li>
<li>리뷰어 1명이 승인했다</li>
<li>비밀키·비밀번호 하드코딩이 없다</li>
</ol>

<h2>폴더 두 개: 자료 저장소와 작업 폴더</h2>
<div class="tbl"><table>
<thead><tr><th>폴더</th><th>들어 있는 것</th><th>AI 도구</th></tr></thead>
<tbody>
<tr><td><code>studyroom-scrum-lab</code><br>자료 저장소</td><td>실습 가이드, 복습용 가이드, 예시 답, 작업 폴더 도구(<code>lab.mjs</code>)</td><td><strong>열지 않습니다</strong></td></tr>
<tr><td><code>~/scrum-labs/studyroom</code><br>작업 폴더</td><td>시작 코드와 양식만. 팀 저장소로 GitHub에 올라가는 폴더</td><td>여기서만 엽니다</td></tr>
</tbody></table></div>
<p>자료 저장소에서 AI를 열면 AI가 가이드와 예시 답을 먼저 읽고, 팀이 정할 답을 미리 채워 버립니다. 그래서 실습은 저장소 바깥의 작업 폴더에서 합니다.</p>

<h2>작업 폴더에 들어 있는 것</h2>
<div class="tbl"><table>
<thead><tr><th>파일·폴더</th><th>쓰는 곳</th></tr></thead>
<tbody>
<tr><td><code>AGENTS.md</code></td><td>팀 AI 규칙. Planning에서 채우고, 회고에서 한 줄씩 더합니다</td></tr>
<tr><td><code>docs/backlog.md</code></td><td>제품 백로그. S1~S4</td></tr>
<tr><td><code>docs/templates/</code></td><td>질문 프롬프트(01), 스토리·인수조건 양식(02), DoD(04), 회고 KPT(05)</td></tr>
<tr><td><code>src/</code>, <code>test/</code></td><td>서버 뼈대와 테스트. 처음에는 서버가 뜨는지만 확인하는 테스트 2개뿐입니다</td></tr>
<tr><td>브랜치 <code>after</code></td><td>정답 예시. 막혔을 때 비교하거나 따라잡는 데 씁니다(6-1)</td></tr>
</tbody></table></div>

<h2>이 가이드 읽는 법</h2>
<p>각 단계 페이지는 같은 순서로 되어 있습니다. 누가·몇 분에, 할 일, 이렇게 되면 성공, 예시 화면, 막히면, 다음 단계입니다.</p>
<div class="legend">
<div><span class="where">터미널</span><p>작업 폴더(<code>~/scrum-labs/studyroom</code>)에서 입력합니다. <code>node lab.mjs</code> 명령만 자료 저장소 폴더에서 합니다. 복사 버튼은 <code># →</code> 뒤 설명을 빼고 복사합니다.</p></div>
<div><span class="where where-ai">Claude Code</span><p>Claude Code 입력창(<code>&gt;</code>)에 붙여 넣는 문장입니다.</p></div>
<div><span class="where where-gh">GitHub 웹</span><p>브라우저의 GitHub 화면에서 순서대로 누릅니다.</p></div>
<div><span class="where where-board">보드</span><p>화이트보드·포스트잇 또는 GitHub Projects에서 합니다.</p></div>
</div>
<div class="codeblock out"><div class="codehead"><span class="where where-out">실행 결과 예시</span><span class="lbl">회색 상자는 입력하지 않습니다</span></div><pre><code>화면에 이렇게 나오면 맞게 한 것입니다.</code></pre></div>
<div class="note ok"><b>이렇게 되면 성공</b><p>초록 상자는 그 단계가 끝났는지 확인하는 기준입니다. 다르게 나오면 바로 아래 빨간 "막히면" 상자를 먼저 보세요.</p></div>
<div class="note info"><b>예시 화면은 실제 실행 결과입니다</b><p>2-2부터 5-2까지의 예시 화면은 2026년 10월 23일에 이 가이드를 그대로 따라 실행한 결과입니다. 강사 환경에서 Claude Code를 자동 실행 모드로 돌렸고, 팀원 두 명은 같은 컴퓨터의 두 폴더로, GitHub 저장소는 로컬 원격 저장소로 대신했습니다. 그래서 GitHub 웹 화면(1-1, 1-2, 3-5, 3-6의 승인·머지)은 실행하지 않았습니다. AI의 결과는 실행할 때마다 다르므로 우리 팀 결과와 달라도 정상입니다.</p></div>
<div class="note info"><b>명령 뒤의 # → 설명</b><p><code>npm test   # → 맨 아래 "pass 2"가 보이면 OK</code>처럼 <code>#</code> 뒤는 설명입니다. 같이 입력해도 무시되니 괜찮습니다.</p></div>
</template>

<template data-id="0-2">
<p class="lead">실습에 필요한 프로그램을 설치하고 확인합니다. 팀원 모두 Node.js·Git·GitHub 계정이 필요하고, Claude Code는 팀에 최소 1명만 있으면 됩니다.</p>

<h2>Step 1. 터미널 정하기</h2>
<div class="tbl"><table>
<thead><tr><th>운영체제</th><th>쓸 터미널</th></tr></thead>
<tbody>
<tr><td>macOS</td><td>터미널(Terminal) 또는 iTerm</td></tr>
<tr><td>Windows</td><td><strong>Git Bash</strong> (Git을 설치하면 함께 생깁니다). 이 가이드의 명령은 모두 Git Bash 기준입니다</td></tr>
<tr><td>Linux</td><td>기본 터미널</td></tr>
</tbody></table></div>
<div class="note warn"><b>Windows는 PowerShell 대신 Git Bash</b><p>PowerShell에서 <code>echo ... &gt; 파일</code>을 쓰면 파일이 다른 인코딩으로 저장돼 Claude가 읽지 못할 수 있고, 줄 끝 <code>\</code>로 이어 쓰는 curl 명령도 동작하지 않습니다.</p></div>

<h2>Step 2. Node.js와 Git 확인</h2>
<pre data-where="터미널"><code>node -v          # → v22.18.0 이상이면 OK
git --version    # → git version 2.x 가 나오면 OK</code></pre>
<p>Node가 없거나 22.18보다 낮으면 <a href="https://nodejs.org" target="_blank" rel="noopener">nodejs.org</a>에서 LTS(22 이상)를 설치합니다. Git이 없으면 <a href="https://git-scm.com" target="_blank" rel="noopener">git-scm.com</a>에서 설치합니다. 설치 후에는 <strong>터미널을 새로 열고</strong> 다시 확인합니다.</p>

<h2>Step 3. GitHub 계정과 Git 이름 설정</h2>
<p>계정이 없으면 <a href="https://github.com" target="_blank" rel="noopener">github.com</a>에서 만듭니다. 커밋에 이름이 남도록 한 번만 설정합니다.</p>
<pre data-where="터미널"><code>git config --global user.name "홍길동"
git config --global user.email "내GitHub이메일@example.com"</code></pre>

<h2>Step 4. Claude Code 설치와 로그인 (팀에 최소 1명)</h2>
<p>Claude Code를 쓰려면 Claude 유료 구독(Pro 이상) 또는 Claude Console 계정이 필요합니다. 팀에서 한 명만 있어도 실습이 됩니다. 그 사람이 개발자 A를 맡고, Planning과 Build를 그 노트북으로 진행합니다.</p>
<pre data-where="터미널" data-label="macOS · Linux · Git Bash"><code>curl -fsSL https://claude.ai/install.sh | bash</code></pre>
<p>Windows PowerShell에서는 <code>irm https://claude.ai/install.ps1 | iex</code>, Homebrew는 <code>brew install --cask claude-code</code>로 설치합니다. 설치가 끝나면 터미널을 새로 열고 확인합니다.</p>
<pre data-where="터미널"><code>claude --version   # → 숫자 뒤에 (Claude Code)가 나오면 OK
claude             # → 브라우저가 열리면 로그인</code></pre>
<p>로그인이 끝나 Claude Code 화면이 나오면 <code>/exit</code>를 입력해 나옵니다.</p>

<h2>Step 5. 알아 둘 조작 세 가지</h2>
<div class="tbl"><table>
<thead><tr><th>조작</th><th>하는 일</th><th>언제 쓰나</th></tr></thead>
<tbody>
<tr><td><kbd>Esc</kbd></td><td>Claude가 하던 일을 멈춘다</td><td>엉뚱한 방향으로 갈 때 바로</td></tr>
<tr><td><kbd>Shift</kbd>+<kbd>Tab</kbd></td><td>권한 모드를 바꾼다. 지금 모드는 화면 아래에 나온다</td><td>Planning 2-4에서 plan → 기본 모드(표시 없음)</td></tr>
<tr><td><code>/exit</code></td><td>Claude Code를 끝낸다</td><td>결과를 터미널에서 확인하기 전</td></tr>
</tbody></table></div>

    const head = document.createElement('div'); head.className = 'codehead';
    head.innerHTML = `<span class="where${cls}">${esc(where)}</span><span class="lbl">${esc(pre.dataset.label || '')}</span>` + (isOut || where.startsWith('보드') || where.startsWith('GitHub') ? '' : '<button class="copy" type="button">복사</button>');
    pre.replaceWith(wrap); wrap.append(head, pre);
    pre.removeAttribute('data-where'); pre.removeAttribute('data-out');
    const btn = head.querySelector('.copy');
    if (btn) btn.addEventListener('click', e => copyText(e.currentTarget, pre));
  });
}
function lecturePage(l){
  const art = document.querySelector(`template[data-id="${l.id}"]`);
  const i = lectures.indexOf(l), prev = lectures[i-1], next = lectures[i+1];
  const chips = `<span class="chip kind">${esc(l.kind)}</span>` + (l.clock ? `<span class="chip clock">${esc(l.sec.title)} ${esc(l.clock)}</span>` : (l.min ? `<span class="chip clock">${l.min}분</span>` : '')) + (l.clock ? '' : `<span class="chip">${esc(l.sum)}</span>`);
  return `<p class="crumb">섹션 ${l.sec.no} · ${esc(l.sec.title)}</p>
  <h1>${l.id} ${esc(l.title)}</h1>
  <div class="chips">${chips}</div>
  ${art ? art.innerHTML : ''}
  <div class="foot">
    <button class="btn donebtn" type="button" id="donebtn" aria-pressed="${done.has(l.id)}">${done.has(l.id) ? '완료함' : '완료로 표시'}</button>
    <div class="navpair">${prev ? `<a class="btn" href="#l-${prev.id}">이전 · ${prev.id}</a>` : ''}${next ? `<a class="btn primary" href="#l-${next.id}">다음 · ${next.id} ${esc(next.title)}</a>` : ''}</div>
  </div>`;
}
function homePage(){
  const tpl = document.getElementById('tpl-home').innerHTML;
  const secs = DATA.sections.map(s => {
    const n = s.lectures.length, d = s.lectures.filter(l => done.has(l.id)).length;
    return `<a class="seccard" href="#l-${s.lectures[0].id}"><span class="n">${s.no}</span><span class="t">${esc(s.title)}<small>${s.lectures.map(l => l.id + ' ' + esc(l.title)).join(' · ')}</small></span><span class="m">${secMin(s)} · ${d}/${n}</span></a>`;
  }).join('');
  const vers = DATA.versions.map(([k, v]) => `<span class="chip">${esc(k)} ${esc(v)}</span>`).join('');
  return tpl.replace('{{course}}', esc(DATA.course)).replace('{{sections}}', secs).replace('{{versions}}', vers);
}
function route(){
  const m = location.hash.match(/^#l-(\d-\d)$/);
  const main = document.getElementById('main');
  const l = m && byId[m[1]];
  if (l){
    main.innerHTML = lecturePage(l);
    store.set(LAST_KEY, l.id);
    main.querySelector('#donebtn').addEventListener('click', () => {
      done.has(l.id) ? done.delete(l.id) : done.add(l.id);
      store.set(DONE_KEY, [...done]); route(); renderToc(); markCurrent(); renderProgress();
    });
  } else {
    main.innerHTML = homePage();
    const last = store.get(LAST_KEY, null), r = main.querySelector('#resume');
    if (last && byId[last] && r){ r.hidden = false; r.href = '#l-' + last; r.textContent = `이어서 하기 · ${last}`; }
  }
  decorate(main);
  const form = store.get(FORM_KEY, {});
  main.querySelectorAll('input.cell').forEach(c => {
    c.value = form[c.dataset.key] || '';
    c.addEventListener('input', () => { const f = store.get(FORM_KEY, {}); f[c.dataset.key] = c.value; store.set(FORM_KEY, f); });
  });
  markCurrent();
  document.getElementById('toc').classList.remove('open');
  document.getElementById('navtoggle').setAttribute('aria-expanded', 'false');
}
function markCurrent(){
  const m = location.hash.match(/^#l-(\d-\d)$/);
  document.querySelectorAll('#toc a').forEach(a => a.removeAttribute('aria-current'));
  const cur = m ? document.querySelector(`#toc a[data-id="${m[1]}"]`) : document.querySelector('#toc a.home');
  if (cur){ cur.setAttribute('aria-current', 'page'); }
}
document.getElementById('navtoggle').addEventListener('click', e => {
  const t = document.getElementById('toc'); const open = t.classList.toggle('open');
  e.currentTarget.setAttribute('aria-expanded', String(open));
});
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
renderToc(); renderProgress(); route();
</script>

</body></html>
